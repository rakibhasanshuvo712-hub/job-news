<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article — JobNews</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="/"><span class="logo-badge">JN</span><span class="word">JobNews</span></a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/jobs.html">Jobs</a>
        <a href="/news.html">News</a>
        <a href="/admin.html" class="btn-ghost-admin">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container article-wrap" id="article-root">
        <div class="skeleton">Loading article…</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container foot-note" style="margin:0;border:0">
      <span>© 2026 JobNews. Demo project.</span>
      <span><a href="/news.html" style="display:inline">← All news</a></span>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    (async () => {
      if (!id) { location.href = '/news.html'; return; }
      try {
        const { article } = await api('/api/news/' + id);
        document.title = `${article.title} — JobNews`;
        const paras = article.content.split(/\n\s*\n/).filter(p => p.trim());
        const html = paras.map(p =>
          '<p>' + esc(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</p>'
        ).join('');
        qs('#article-root').innerHTML = `
          <div class="article-hero ${article.gradient}">${{ landmark: '🏛️', 'building-columns': '🏦', 'laptop-code': '💻', briefcase: '💼', handshake: '🤝', 'graduation-cap': '🎓', 'heart-pulse': '🩺', 'shield-halved': '🛡️', 'book-open': '📖', 'chart-line': '📈', coins: '🪙', lightbulb: '💡', newspaper: '📰' }[article.emoji] || '📰'}</div>
          <h1>${esc(article.title)}</h1>
          <div class="article-meta">
            <span>🏷️ ${esc(article.category)}</span>
            <span>✍️ ${esc(article.author)}</span>
            <span>📅 ${fmtDate(article.publishedAt)}</span>
          </div>
          <div class="article-content">${html}</div>
          <p style="margin-top:26px"><a class="btn btn-outline" href="/news.html">← Back to all news</a></p>`;
      } catch (err) {
        qs('#article-root').innerHTML = `<div class="empty-state"><div class="big">🔍</div><b>${esc(err.message)}</b><p><a href="/news.html">Browse all news →</a></p></div>`;
      }
    })();
  </script>
</body>
</html>
