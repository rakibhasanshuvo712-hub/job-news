<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career News — JobNews</title>
  <meta name="description" content="Job exam notices, circular news, industry trends and career advice.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="/"><span class="logo-badge">JN</span><span class="word">JobNews</span></a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/jobs.html">Jobs</a>
        <a href="/news.html">News</a>
        <a href="/admin.html" class="btn-ghost-admin">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <div class="container">
        <h1>Career news & notices</h1>
        <p>Exam dates, circular announcements, industry hiring trends and practical career advice.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="news-grid" id="news-grid"><div class="skeleton">Loading news…</div></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container foot-note" style="margin:0;border:0">
      <span>© 2026 JobNews. Demo project.</span>
      <span><a href="/" style="display:inline">← Back to home</a></span>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    api('/api/news?limit=50').then(({ news }) => {
      qs('#news-grid').innerHTML = news.map(newsCard).join('');
    }).catch(() => {
      qs('#news-grid').innerHTML = '<div class="skeleton">Failed to load news.</div>';
    });
  </script>
</body>
</html>
